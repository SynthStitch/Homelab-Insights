name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to homelab
    needs: check
    # Only real pushes to main deploy; PRs and forks never touch the box.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab]
    environment: homelab
    steps:
      - name: Pull main and rebuild containers
        working-directory: /opt/homelab-insights
        run: |
          git fetch --prune origin
          git reset --hard origin/main
          docker compose up -d --build --remove-orphans
          docker image prune -f >/dev/null

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:4100/ >/dev/null; then
              echo "app is up"; exit 0
            fi
            sleep 3
          done
          echo "app did not come up"; docker compose -f /opt/homelab-insights/docker-compose.yml logs --tail=50 app; exit 1
